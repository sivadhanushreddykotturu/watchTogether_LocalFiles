name: Zero-Downtime Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Zero-Downtime Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook Deploy on EC2
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Error: DEPLOY_TOKEN secret is not configured in GitHub repository settings."
            echo "Please go to Repo Settings -> Secrets and variables -> Actions -> New repository secret -> DEPLOY_TOKEN"
            exit 1
          fi

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://reelsync.duckdns.org/api/deploy-webhook" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -d '{"ref":"refs/heads/main"}')
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\r' | tail -n 1 | cut -d: -f2)
          
          echo "$HTTP_BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Deployment trigger failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Deployment successfully initiated!"
